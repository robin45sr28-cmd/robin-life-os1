services:
  - type: web
    name: robin-life-os-ai
    runtime: node
    plan: free
    rootDir: ai-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: ALLOWED_ORIGIN
        value: https://md4437555-crearte.github.io
